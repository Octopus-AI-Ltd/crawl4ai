# Application Configuration
app:
  title: "Crawl4AI API"
  version: "1.0.0"
  host: "0.0.0.0"
  port: 11235
  reload: False
  workers: 1
  timeout_keep_alive: 300

# Default LLM Configuration
llm:
  provider: "openai/gpt-4o-mini"
  # api_key: sk-...  # If you pass the API key directly (not recommended)

# Redis Configuration
redis:
  host: "localhost"
  port: 6379
  db: 0
  password: ""
  ssl: False
  ssl_cert_reqs: None
  ssl_ca_certs: None
  ssl_certfile: None
  ssl_keyfile: None
  ssl_cert_reqs: None
  ssl_ca_certs: None
  ssl_certfile: None
  ssl_keyfile: None

# Rate Limiting Configuration
rate_limiting:
  enabled: True
  default_limit: "1000/minute"
  trusted_proxies: []
  storage_uri: "memory://"  # Use "redis://localhost:6379" for production

# Security Configuration
# WARNING: For production deployments, enable security and use proper SECRET_KEY:
#   - Set jwt_enabled: true for authentication
#   - Set SECRET_KEY environment variable to a secure random value
#   - Set CRAWL4AI_HOOKS_ENABLED=true only if you need hooks (RCE risk)
security:
  enabled: false
  jwt_enabled: false
  https_redirect: false
  trusted_hosts: ["*"]
  headers:
    x_content_type_options: "nosniff"
    x_frame_options: "DENY"
    content_security_policy: "default-src 'self'"
    strict_transport_security: "max-age=63072000; includeSubDomains"

# Crawler Configuration
crawler:
  base_config:
    simulate_user: true
  memory_threshold_percent: 95.0
  rate_limiter:
    enabled: true
    base_delay: [1.0, 2.0]
  timeouts:
    stream_init: 30.0  # Timeout for stream initialization
    batch_process: 300.0  # Timeout for batch processing
  pool:
    max_pages: 40                          # ← GLOBAL_SEM permits (concurrent arun calls)
    # Pages open at once INSIDE one crawl. A deep crawl is a single arun call, so
    # max_pages above does not cap it — this does. Twenty needs about 4GB, which is
    # the whole container, and eight still lost Chromium at 80%. See resource_limits.py.
    max_session_permit: 4
    # The share of the container at which a crawl stops opening new pages and lets
    # those in flight finish. A brake, not a target. Must sit BELOW where things
    # actually break: Chromium was killed at 80.3% on 2026-08-31.
    memory_threshold_percent: 70
    idle_ttl_sec: 300                     # ← 30 min janitor cutoff
    # The share of the container's process/thread allowance past which an IDLE
    # browser is thrown away. Not a brake - Chromium only returns those tasks by
    # exiting, so there is nothing to wait for. See resource_limits.py.
    task_recycle_percent: 60
    # The share of that allowance at which a crawl stops opening new pages, so the
    # ones in flight can finish and the browser can be restarted with nothing open
    # to lose. Above task_recycle_percent, which is what the restart then tests.
    # A 248-page crawl reached 952 of 1000 on 2026-09-01 and lost 107 pages.
    task_brake_percent: 70
  browser:
    kwargs:
      headless: true
      text_mode: true
    extra_args:
      # - "--single-process"
      # Chromium is a process tree and the cgroup `pids` limit counts every thread
      # in it. These two are meant to cap the sprawl at source.
      #
      # ⚠️ Measured 2026-09-01, they do not: 38 Chromium processes holding 885
      # threads during one crawl, of which 18+ were renderers, with the limit set
      # to 8. Chromium treats it as a hint and site isolation overrides it. They
      # are kept because they do no harm and may help on some pages, but nothing
      # should be built on the assumption that they bound anything.
      #
      # What actually bounds it is restarting the browser mid-crawl - Chromium
      # gives its processes back only by exiting. See resource_limits.py and
      # BrowserManager.recycle_if_process_starved.
      - "--process-per-site"
      - "--renderer-process-limit=8"
      - "--no-sandbox"
      - "--disable-dev-shm-usage"
      - "--disable-gpu"
      - "--disable-software-rasterizer"
      - "--disable-web-security"
      - "--allow-insecure-localhost"
      - "--ignore-certificate-errors"

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Observability Configuration
observability:
  prometheus:
    enabled: True
    endpoint: "/metrics"
  health_check:
    endpoint: "/health"

# Webhook Configuration
webhooks:
  enabled: true
  default_url: null  # Optional: default webhook URL for all jobs
  data_in_payload: false  # Optional: default behavior for including data
  retry:
    max_attempts: 5
    initial_delay_ms: 1000  # 1s, 2s, 4s, 8s, 16s exponential backoff
    max_delay_ms: 32000
    timeout_ms: 30000  # 30s timeout per webhook call
  headers:  # Optional: default headers to include
    User-Agent: "Crawl4AI-Webhook/1.0"